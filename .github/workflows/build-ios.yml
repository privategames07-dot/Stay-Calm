name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'web/**'
      - 'tests/**'
      - 'scripts/build-ios.sh'
      - 'scripts/make-source.py'
      - 'scripts/sync-version.py'
      - '.github/workflows/build-ios.yml'
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Derive pre-release version
        run: python3 scripts/sync-version.py
      - name: Test timetable and records
        run: node --test tests/*.cjs
      - name: Check hitbox and milestone playback
        run: node tests/combo-browser.mjs
      - name: Compile for iPhone and package unsigned IPA
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stay-calm-iphone
          path: dist/stay-calm-*.ipa
          if-no-files-found: error
          retention-days: 14
  release:
    if: github.ref == 'refs/heads/main'
    needs: iphone
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stay-calm-iphone
          path: dist
      - name: Publish versioned IPA and Feather source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/make-source.py
          tag="build-$(jq -r '.apps[0].buildVersion' dist/source.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/stay-calm-*.ipa dist/source.json --clobber
            gh release edit "$tag" --title "stay calm! 0.${tag#build-}"
          else
            gh release create "$tag" dist/stay-calm-*.ipa dist/source.json web/logo.jpg --target "$GITHUB_SHA" --title "stay calm! 0.${tag#build-}" --notes "Feather에서 IPA를 서명해 설치할 수 있습니다."
          fi
