name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - 'ios/Info.plist'
      - 'scripts/sync-version.py'
      - 'scripts/normalize-release-versions.py'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Derive pre-release version
        run: python3 scripts/sync-version.py
      - name: Check shared game rules
        run: node --test tests/*.cjs
      - name: Build signed APK and instrumentation tests
        working-directory: android
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app and OCR on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: gradle :app:connectedDebugAndroidTest
      - name: Package and verify APK
        run: |
          build="$(python3 -c "import plistlib; print(plistlib.load(open('ios/Info.plist','rb'))['CFBundleVersion'])")"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/stay-calm-$build.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "dist/stay-calm-$build.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: stay-calm-android
          path: dist/*.apk
          if-no-files-found: error
      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build="$(python3 -c "import plistlib; print(plistlib.load(open('ios/Info.plist','rb'))['CFBundleVersion'])")"
          for attempt in {1..30}; do
            if gh release view "build-$build"; then break; fi
            sleep 10
          done
          gh release view "build-$build"
          gh release upload "build-$build" dist/*.apk --clobber
      - name: Normalize previous public release versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/normalize-release-versions.py
    permissions:
      contents: write
