plugins { id 'com.android.application' }

def plist = file('../../ios/Info.plist').text
def buildNumber = (plist =~ /(?s)<key>CFBundleVersion<\/key>\s*<string>(\d+)<\/string>/)[0][1] as int
def displayVersion = (plist =~ /(?s)<key>CFBundleShortVersionString<\/key>\s*<string>([^<]+)<\/string>/)[0][1]

android {
    namespace 'io.privategames07.staycalm'
    compileSdk 35
    defaultConfig {
        applicationId 'io.privategames07.staycalm'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName displayVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    if (System.getenv('ANDROID_TEST_KEYSTORE')) {
        signingConfigs.debug {
            storeFile file(System.getenv('ANDROID_TEST_KEYSTORE'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/sharedAssets')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('copySharedWeb', Copy) {
    from '../../web'
    into layout.buildDirectory.dir('generated/sharedAssets/web')
    filesMatching('index.html') {
        filter { line -> line.replace('<head>', '<head><script src="../android-bridge.js"></script>') }
    }
}
tasks.named('preBuild').configure { dependsOn 'copySharedWeb' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
